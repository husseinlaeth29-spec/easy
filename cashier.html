<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>كاشير - معدّاتي</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #6C3FC5;
    --primary-light: #8B5CF6;
    --accent: #F59E0B;
    --accent2: #EF4444;
    --green: #10b981;
    --blue: #3b82f6;
    --orange: #f97316;
    --bg: #0f0f1a;
    --card: #1a1a2e;
    --card2: #16213e;
    --border: rgba(108,63,197,0.2);
    --text: #f1f0ff;
    --text-light: #9ca3af;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Cairo',sans-serif; background:var(--bg); color:var(--text); direction:rtl; min-height:100vh; }

  #loginScreen {
    position:fixed; inset:0; background:linear-gradient(135deg,#1a1a2e 0%,#16213e 100%);
    display:flex; align-items:center; justify-content:center; z-index:9999;
  }
  .login-box {
    background:var(--card); border:1px solid var(--border); border-radius:20px;
    padding:2.5rem 2rem; width:100%; max-width:340px; text-align:center;
    box-shadow:0 10px 40px rgba(0,0,0,.4);
  }
  .login-box .lock-icon { font-size:2.5rem; margin-bottom:.5rem; display:block; }
  .login-box h2 { font-family:'Tajawal',sans-serif; font-weight:900; color:var(--primary-light); margin-bottom:1.5rem; font-size:1.15rem; }
  .login-box input {
    width:100%; padding:.8rem 1rem; border:2px solid var(--border); border-radius:12px;
    font-family:'Cairo',sans-serif; font-size:1rem; text-align:center; letter-spacing:3px;
    margin-bottom:1rem; direction:ltr; background:var(--bg); color:var(--text);
  }
  .login-box input:focus { outline:none; border-color:var(--primary-light); }
  .login-box button {
    width:100%; background:linear-gradient(135deg,var(--primary) 0%,var(--primary-light) 100%);
    color:white; border:none; border-radius:14px; padding:.8rem; font-family:'Cairo',sans-serif;
    font-weight:700; font-size:.95rem; cursor:pointer;
  }
  .login-error { color:var(--accent2); font-size:.82rem; font-weight:700; margin-bottom:.8rem; display:none; }
  #cashierContent { display:none; }

  header {
    background:var(--card);
    border-bottom:1px solid var(--border);
    padding:0 2rem;
    height:65px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    position:sticky; top:0; z-index:100;
  }
  .header-right { display:flex; align-items:center; gap:1.5rem; }
  .logo { font-family:'Tajawal',sans-serif; font-weight:900; font-size:1.3rem; color:var(--primary-light); display:flex; align-items:center; gap:.5rem; }
  .page-title { font-size:.9rem; color:var(--text-light); border-right:1px solid var(--border); padding-right:1.5rem; }
  .live-badge { display:flex; align-items:center; gap:.4rem; background:rgba(16,185,129,.1); border:1px solid rgba(16,185,129,.3); color:var(--green); padding:.3rem .8rem; border-radius:20px; font-size:.78rem; font-weight:700; }
  .live-dot { width:8px; height:8px; background:var(--green); border-radius:50%; animation:pulse 1.5s infinite; }
  @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.5;transform:scale(.8)} }
  .header-stats { display:flex; gap:1.5rem; align-items:center; }
  .hstat { text-align:center; }
  .hstat-num { font-family:'Tajawal',sans-serif; font-weight:900; font-size:1.1rem; color:var(--primary-light); display:block; }
  .hstat-label { font-size:.7rem; color:var(--text-light); }

  .board { display:grid; grid-template-columns:repeat(4,1fr); gap:1rem; padding:1.5rem; min-height:calc(100vh - 65px); }
  @media(max-width:1300px) { .board { grid-template-columns:repeat(2,1fr); } }
  @keyframes pulse { 0%, 100% { transform:scale(1); } 50% { transform:scale(1.01); } }

  .column { background:var(--card); border-radius:16px; border:1px solid var(--border); display:flex; flex-direction:column; max-height:calc(100vh - 100px); }
  .col-header { padding:1rem 1.2rem; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; border-radius:16px 16px 0 0; flex-shrink:0; }
  .col-header-new { background:rgba(59,130,246,.1); }
  .col-header-prep { background:rgba(249,115,22,.1); }
  .col-header-done { background:rgba(16,185,129,.1); }
  .col-title { display:flex; align-items:center; gap:.6rem; font-weight:900; font-family:'Tajawal',sans-serif; font-size:1rem; }
  .col-dot { width:10px; height:10px; border-radius:50%; }
  .dot-new { background:var(--blue); }
  .dot-prep { background:var(--orange); animation:pulse 1.5s infinite; }
  .dot-done { background:var(--green); }
  .col-count { font-size:.8rem; font-weight:700; padding:.2rem .7rem; border-radius:20px; }
  .count-new { background:rgba(59,130,246,.2); color:var(--blue); }
  .count-prep { background:rgba(249,115,22,.2); color:var(--orange); }
  .count-done { background:rgba(16,185,129,.2); color:var(--green); }

  .col-body { flex:1; overflow-y:auto; padding:.8rem; display:flex; flex-direction:column; gap:.8rem; }
  .col-body::-webkit-scrollbar { width:4px; }
  .col-body::-webkit-scrollbar-thumb { background:var(--border); border-radius:2px; }

  .order-card { background:var(--card2); border-radius:14px; border:1px solid var(--border); overflow:hidden; transition:all .3s; animation:slideIn .35s ease; cursor:pointer; }
  @keyframes slideIn { from{opacity:0;transform:translateY(-10px)} to{opacity:1;transform:translateY(0)} }
  .order-card:hover { border-color:var(--primary-light); transform:translateY(-2px); box-shadow:0 8px 24px rgba(108,63,197,.2); }

  .order-card-header { padding:.8rem 1rem; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--border); }
  .order-id { font-family:'Tajawal',sans-serif; font-weight:900; font-size:1rem; color:var(--primary-light); }
  .order-time { font-size:.72rem; color:var(--text-light); }

  .order-items { padding:.8rem 1rem; }
  .order-item-row { display:flex; justify-content:space-between; align-items:center; padding:.3rem 0; font-size:.83rem; border-bottom:1px dashed rgba(255,255,255,.05); }
  .order-item-row:last-child { border-bottom:none; }
  .item-name { color:var(--text); font-weight:600; }
  .item-qty { background:rgba(108,63,197,.2); color:var(--primary-light); border-radius:8px; padding:.1rem .5rem; font-size:.75rem; font-weight:700; }
  .item-price { color:var(--text-light); font-size:.78rem; }

  .order-footer { padding:.7rem 1rem; background:rgba(0,0,0,.2); display:flex; align-items:center; justify-content:space-between; gap:.5rem; }
  .order-total { font-family:'Tajawal',sans-serif; font-weight:900; font-size:.95rem; color:var(--accent); }
  .order-actions { display:flex; gap:.4rem; }

  .btn-action { border:none; border-radius:10px; padding:.35rem .8rem; font-family:'Cairo',sans-serif; font-size:.75rem; font-weight:700; cursor:pointer; transition:all .2s; white-space:nowrap; }
  .btn-prepare { background:rgba(249,115,22,.15); color:var(--orange); border:1px solid rgba(249,115,22,.3); }
  .btn-prepare:hover { background:var(--orange); color:white; }
  .btn-deliver { background:rgba(16,185,129,.15); color:var(--green); border:1px solid rgba(16,185,129,.3); }
  .btn-deliver:hover { background:var(--green); color:white; }
  .btn-delete-order { background:rgba(239,68,68,.1); color:var(--accent2); border:1px solid rgba(239,68,68,.2); border-radius:10px; padding:.35rem .6rem; font-size:.75rem; cursor:pointer; transition:all .2s; }
  .btn-delete-order:hover { background:var(--accent2); color:white; }
  .btn-cancel { background:rgba(239,68,68,.15); color:var(--accent2); border:1px solid rgba(239,68,68,.3); }
  .btn-cancel:hover { background:var(--accent2); color:white; }
  .btn-return { background:rgba(148,163,184,.15); color:#94a3b8; border:1px solid rgba(148,163,184,.3); }
  .btn-return:hover { background:#94a3b8; color:white; }

  .search-bar { padding:0 1.5rem 1rem; }
  .search-input { width:100%; max-width:420px; padding:.7rem 1.1rem; border-radius:12px; border:1px solid var(--border); background:var(--card); color:var(--text); font-family:'Cairo',sans-serif; font-size:.9rem; }
  .search-input::placeholder { color:var(--text-light); }
  .search-input:focus { outline:none; border-color:var(--primary-light); }

  .empty-col { text-align:center; padding:2rem 1rem; color:var(--text-light); font-size:.85rem; }
  .empty-col-icon { font-size:2rem; display:block; margin-bottom:.5rem; opacity:.4; }

  .notif { position:fixed; top:80px; left:50%; transform:translateX(-50%) translateY(-20px); background:var(--green); color:white; padding:.8rem 1.5rem; border-radius:25px; font-weight:700; font-size:.9rem; z-index:9999; opacity:0; transition:all .3s; white-space:nowrap; }
  .notif.show { opacity:1; transform:translateX(-50%) translateY(0); }

  /* MODAL */
  .modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.7); z-index:3000; align-items:center; justify-content:center; }
  .modal-overlay.open { display:flex; }
  .modal { background:var(--card); border-radius:20px; border:1px solid var(--border); width:460px; max-width:95vw; max-height:85vh; overflow-y:auto; animation:modalIn .3s ease; }
  @keyframes modalIn { from{opacity:0;transform:scale(.95)} to{opacity:1;transform:scale(1)} }
  .modal-header { padding:1.2rem 1.5rem; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; background:linear-gradient(135deg,rgba(108,63,197,.2),rgba(139,92,246,.1)); }
  .modal-title { font-family:'Tajawal',sans-serif; font-weight:900; font-size:1.1rem; color:var(--primary-light); }
  .btn-close-modal { background:rgba(255,255,255,.1); border:none; color:var(--text); width:32px; height:32px; border-radius:50%; cursor:pointer; font-size:1rem; transition:background .2s; }
  .btn-close-modal:hover { background:rgba(239,68,68,.3); }
  .modal-body { padding:1.5rem; }
  .modal-section-title { font-weight:700; font-size:.85rem; color:var(--text-light); margin-bottom:.8rem; margin-top:1.2rem; }
  .modal-section-title:first-child { margin-top:0; }
  .modal-item { display:flex; justify-content:space-between; padding:.6rem 0; border-bottom:1px solid var(--border); font-size:.88rem; }
  .modal-item:last-child { border-bottom:none; }
  .status-badge { display:inline-flex; align-items:center; gap:.4rem; padding:.3rem .8rem; border-radius:20px; font-size:.8rem; font-weight:700; }
  .status-new { background:rgba(59,130,246,.15); color:var(--blue); }
  .status-prep { background:rgba(249,115,22,.15); color:var(--orange); }
  .status-done { background:rgba(16,185,129,.15); color:var(--green); }
  .status-cancel { background:rgba(148,163,184,.15); color:#94a3b8; }

  .nav-links-bottom { display:flex; gap:.5rem; padding:0 1.5rem 1rem; }
  .nav-link-btn { background:rgba(108,63,197,.15); color:var(--primary-light); border:1px solid var(--border); border-radius:10px; padding:.4rem .9rem; font-family:'Cairo',sans-serif; font-size:.8rem; font-weight:700; cursor:pointer; text-decoration:none; transition:all .2s; }
  .nav-link-btn:hover { background:rgba(108,63,197,.3); }

  @media(max-width:900px) { .board { grid-template-columns:1fr; } .header-stats { display:none; } }
</style>
</head>
<body>

<div id="loginScreen">
  <div class="login-box">
    <span class="lock-icon">🔒</span>
    <h2>أدخل رمز دخول الكاشير</h2>
    <div class="login-error" id="loginError">رمز غير صحيح، حاول مرة ثانية</div>
    <input type="password" id="loginCode" placeholder="••••" maxlength="20" inputmode="numeric">
    <button onclick="tryLogin()">دخول</button>
  </div>
</div>

<div id="cashierContent">
<div class="notif" id="notif"></div>

<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
  <div class="modal" id="modalBox">
    <div class="modal-header">
      <span class="modal-title" id="modalTitle">تفاصيل الطلب</span>
      <button class="btn-close-modal" onclick="closeModalDirect()">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<header>
  <div class="header-right">
    <div class="logo">🔧 معدّاتي</div>
    <span class="page-title">لوحة الكاشير</span>
    <div class="live-badge"><span class="live-dot"></span> مباشر</div>
  </div>
  <div class="header-stats">
    <div class="hstat"><span class="hstat-num" id="statNew">0</span><span class="hstat-label">جديد</span></div>
    <div class="hstat"><span class="hstat-num" id="statPrep">0</span><span class="hstat-label">قيد التحضير</span></div>
    <div class="hstat"><span class="hstat-num" id="statDone">0</span><span class="hstat-label">تم التوصيل</span></div>
  </div>
</header>

<div class="search-bar">
  <input type="text" class="search-input" id="searchInput" placeholder="🔍 بحث برقم الطلب، الاسم، أو الهاتف..." oninput="renderBoard()">
</div>

<div class="board">
  <div class="column">
    <div class="col-header col-header-new">
      <div class="col-title"><span class="col-dot dot-new"></span>طلبات جديدة</div>
      <span class="col-count count-new" id="countNew">0</span>
    </div>
    <div class="col-body" id="colNew"><div class="empty-col"><span class="empty-col-icon">📭</span>ما في طلبات جديدة</div></div>
  </div>
  <div class="column">
    <div class="col-header col-header-prep">
      <div class="col-title"><span class="col-dot dot-prep"></span>قيد التحضير</div>
      <span class="col-count count-prep" id="countPrep">0</span>
    </div>
    <div class="col-body" id="colPrep"><div class="empty-col"><span class="empty-col-icon">⚙️</span>ما في طلبات قيد التحضير</div></div>
  </div>
  <div class="column">
    <div class="col-header col-header-done">
      <div class="col-title"><span class="col-dot dot-done"></span>تم التوصيل</div>
      <span class="col-count count-done" id="countDone">0</span>
    </div>
    <div class="col-body" id="colDone"><div class="empty-col"><span class="empty-col-icon">✅</span>ما في طلبات مكتملة بعد</div></div>
  </div>
  <div class="column">
    <div class="col-header" style="background:rgba(148,163,184,.1);">
      <div class="col-title"><span class="col-dot" style="background:#94a3b8;"></span>ملغي / مرتجع</div>
      <span class="col-count" style="background:rgba(148,163,184,.2);color:#94a3b8;" id="countCancelled">0</span>
    </div>
    <div class="col-body" id="colCancelled"><div class="empty-col"><span class="empty-col-icon">🗂️</span>ما في طلبات ملغية</div></div>
  </div>
</div>
</div><!-- /#cashierContent -->

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>

<script>
/* ===================== نظام الدخول (رمز الكاشير من Firebase) ===================== */
const DEFAULT_CASHIER_CODE = '1234';
let currentCashierCode = DEFAULT_CASHIER_CODE;

db.ref('settings/accessCodes/cashier').on('value', snap => {
  currentCashierCode = snap.val() || DEFAULT_CASHIER_CODE;
});

function tryLogin() {
  const input = document.getElementById('loginCode').value.trim();
  const err = document.getElementById('loginError');
  if (input === currentCashierCode) {
    sessionStorage.setItem('muaddati_cashier_logged', '1');
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('cashierContent').style.display = 'block';
  } else {
    err.style.display = 'block';
    document.getElementById('loginCode').value = '';
    document.getElementById('loginCode').focus();
  }
}
document.getElementById('loginCode').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') tryLogin();
});
if (sessionStorage.getItem('muaddati_cashier_logged') === '1') {
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('cashierContent').style.display = 'block';
}

// كاش محلي بالذاكرة فقط، يتحدث تلقائيًا من Firebase
// FIX: هذول المتغيرين كانوا مستخدمين بدون تعريف (undeclared) وهذا كان يسبب
// ReferenceError داخل db.ref('orders').on('value', ...) ويوقف تحديث اللوحة بالكامل.
let ordersCache = {};
let isFirstLoad = true;
let lastNotifiedOrderId = null;
let previousNewCount = 0;

function playNotificationSound() {
  const audioContext = new (window.AudioContext || window.webkitAudioContext)();
  const oscillator = audioContext.createOscillator();
  const gainNode = audioContext.createGain();
  oscillator.connect(gainNode);
  gainNode.connect(audioContext.destination);
  oscillator.frequency.value = 800;
  oscillator.type = 'sine';
  gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
  gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.5);
  oscillator.start(audioContext.currentTime);
  oscillator.stop(audioContext.currentTime + 0.5);
}

function showNewOrderAlert(orderId, customerName) {
  if (lastNotifiedOrderId === orderId) return;
  lastNotifiedOrderId = orderId;
  
  playNotificationSound();
  showNotif(`🎉 طلب جديد من ${customerName}!`, '#10b981');
  
  // تأثير بصري - ترجيج الصفحة
  document.body.style.animation = 'pulse 0.3s ease-in-out';
  setTimeout(() => {
    document.body.style.animation = '';
  }, 300);
}

function getOrders() {
  return Object.values(ordersCache);
}

function updateOrder(id, changes) {
  db.ref('orders/' + id).update(changes);
}

function timeAgo(timestamp) {
  const diff = Math.floor((Date.now() - timestamp) / 1000);
  if (diff < 60) return diff + ' ث';
  if (diff < 3600) return Math.floor(diff / 60) + ' د';
  return Math.floor(diff / 3600) + ' س';
}

function showNotif(msg, color) {
  const n = document.getElementById('notif');
  n.textContent = msg;
  n.style.background = color || '#10b981';
  n.classList.add('show');
  setTimeout(() => n.classList.remove('show'), 3000);
}

function moveToPrep(id) {
  updateOrder(id, { status: 'preparing', prepTime: Date.now() });
  showNotif('⚙️ الطلب ' + id + ' قيد التحضير', '#f97316');
}

function moveToDelivered(id) {
  updateOrder(id, { status: 'delivered', doneTime: Date.now() });
  showNotif('✅ الطلب ' + id + ' تم التوصيل!', '#10b981');
}

function deleteFromCashier(id) {
  updateOrder(id, { archivedFromCashier: true });
  showNotif('🗑️ حُذف من الكاشير - محفوظ بالأدمن', '#EF4444');
}

function cancelOrder(id) {
  if (!confirm('تريد إلغاء هذا الطلب؟')) return;
  updateOrder(id, { status: 'cancelled', cancelTime: Date.now() });
  showNotif('❌ تم إلغاء الطلب ' + id, '#EF4444');
}

function returnOrder(id) {
  if (!confirm('تريد تسجيل هذا الطلب كمرتجع؟')) return;
  updateOrder(id, { status: 'returned', returnTime: Date.now() });
  showNotif('↩️ تم تسجيل الطلب ' + id + ' كمرتجع', '#94a3b8');
}

function openModal(id) {
  const orders = getOrders();
  const o = orders.find(x => x.id === id);
  if (!o) return;

  document.getElementById('modalTitle').textContent = 'تفاصيل الطلب ' + o.id;

  const statusLabel = { new:'جديد', preparing:'قيد التحضير', delivered:'تم التوصيل', ready:'جاهز', cancelled:'ملغي', returned:'مرتجع' };
  const statusClass = { new:'status-new', preparing:'status-prep', delivered:'status-done', ready:'status-done', cancelled:'status-cancel', returned:'status-cancel' };

  document.getElementById('modalBody').innerHTML = `
    <div class="modal-section-title">معلومات الطلب</div>
    <div class="modal-item"><span>رقم الطلب</span><strong>${o.id}</strong></div>
    <div class="modal-item"><span>الحالة</span><span class="status-badge ${statusClass[o.status] || 'status-new'}">${statusLabel[o.status] || o.status}</span></div>
    <div class="modal-item"><span>وقت الطلب</span><span>${o.time || new Date(o.timestamp).toLocaleString('ar-IQ')}</span></div>
    ${o.customer ? `
    <div class="modal-section-title">معلومات الزبون</div>
    <div class="modal-item"><span>الاسم</span><strong>${o.customer.name}</strong></div>
    <div class="modal-item"><span>الهاتف</span><span>${o.customer.phone}</span></div>
    <div class="modal-item"><span>العنوان</span><span>${o.customer.address}</span></div>
    ${o.customer.notes ? `<div class="modal-item"><span>ملاحظات</span><span>${o.customer.notes}</span></div>` : ''}
    ` : ''}
    <div class="modal-section-title">المنتجات</div>
    ${o.items.map(i => `
      <div class="modal-item">
        <span>${i.name}</span>
        <span style="display:flex;gap:.5rem;align-items:center;">
          <span class="item-qty">x${i.qty}</span>
          <span class="item-price">${(i.price * i.qty).toLocaleString()} د.ع</span>
        </span>
      </div>
    `).join('')}
    <div class="modal-item" style="margin-top:.5rem;border-top:2px solid var(--border);padding-top:.8rem;">
      <strong>المجموع الكلي</strong>
      <strong style="color:var(--accent);font-family:'Tajawal',sans-serif;font-size:1.1rem;">${o.total.toLocaleString()} د.ع</strong>
    </div>
  `;

  document.getElementById('modalOverlay').classList.add('open');
}

function closeModal(e) {
  if (e.target === document.getElementById('modalOverlay')) closeModalDirect();
}

function closeModalDirect() {
  document.getElementById('modalOverlay').classList.remove('open');
}

function buildOrderCard(o, col) {
  let btns = '';
  if (col === 'new') {
    btns = `<button class="btn-action btn-prepare" onclick="event.stopPropagation();moveToPrep('${o.id}')">⚙️ جهّز</button>
            <button class="btn-action btn-cancel" onclick="event.stopPropagation();cancelOrder('${o.id}')">❌ إلغاء</button>`;
  } else if (col === 'prep') {
    btns = `<button class="btn-action btn-deliver" onclick="event.stopPropagation();moveToDelivered('${o.id}')">✅ وصّل</button>
            <button class="btn-action btn-cancel" onclick="event.stopPropagation();cancelOrder('${o.id}')">❌ إلغاء</button>`;
  } else if (col === 'done') {
    btns = `<button class="btn-action btn-return" onclick="event.stopPropagation();returnOrder('${o.id}')">↩️ إرجاع</button>`;
  }

  return `
    <div class="order-card" onclick="openModal('${o.id}')">
      <div class="order-card-header">
        <span class="order-id">${o.id}</span>
        <div style="display:flex;align-items:center;gap:.5rem;">
          <span class="order-time">🕐 ${timeAgo(o.timestamp || Date.now())}</span>
          <button class="btn-delete-order" onclick="event.stopPropagation();deleteFromCashier('${o.id}')">✕</button>
        </div>
      </div>
      <div class="order-items">
        ${o.items.map(i => `
          <div class="order-item-row">
            <span class="item-name">${i.name}</span>
            <div style="display:flex;gap:.4rem;align-items:center;">
              <span class="item-qty">x${i.qty}</span>
              <span class="item-price">${(i.price * i.qty).toLocaleString()}</span>
            </div>
          </div>
        `).join('')}
      </div>
      <div class="order-footer">
        <span class="order-total">${o.total.toLocaleString()} د.ع</span>
        <div class="order-actions">${btns}</div>
      </div>
    </div>
  `;
}

function matchesSearch(o, query) {
  if (!query) return true;
  const q = query.trim().toLowerCase();
  if (!q) return true;
  const id = (o.id || '').toLowerCase();
  const name = (o.customer && o.customer.name || '').toLowerCase();
  const phone = (o.customer && o.customer.phone || '').toLowerCase();
  return id.includes(q) || name.includes(q) || phone.includes(q);
}

function renderBoard() {
  const allOrders = getOrders();
  const query = (document.getElementById('searchInput') || {}).value || '';
  const orders = allOrders.filter(o => !o.archivedFromCashier && matchesSearch(o, query));

  const newOrders  = orders.filter(o => o.status === 'new');
  const prepOrders = orders.filter(o => o.status === 'preparing' || o.status === 'ready');
  const doneOrders = orders.filter(o => o.status === 'delivered');
  const cancelledOrders = orders.filter(o => o.status === 'cancelled' || o.status === 'returned');

  // تنبيه صوتي للطلبات الجديدة
  if (newOrders.length > previousNewCount && isFirstLoad === false) {
    const newOrder = newOrders[newOrders.length - 1];
    showNewOrderAlert(newOrder.id, newOrder.customer?.name || 'زبون جديد');
  }
  previousNewCount = newOrders.length;
  if (isFirstLoad) isFirstLoad = false;

  document.getElementById('countNew').textContent  = newOrders.length;
  document.getElementById('countPrep').textContent = prepOrders.length;
  document.getElementById('countDone').textContent = doneOrders.length;
  document.getElementById('countCancelled').textContent = cancelledOrders.length;
  document.getElementById('statNew').textContent   = newOrders.length;
  document.getElementById('statPrep').textContent  = prepOrders.length;
  document.getElementById('statDone').textContent  = doneOrders.length;

  document.getElementById('colNew').innerHTML  = newOrders.length
    ? [...newOrders].reverse().map(o => buildOrderCard(o, 'new')).join('')
    : '<div class="empty-col"><span class="empty-col-icon">📭</span>ما في طلبات جديدة</div>';

  document.getElementById('colPrep').innerHTML = prepOrders.length
    ? [...prepOrders].reverse().map(o => buildOrderCard(o, 'prep')).join('')
    : '<div class="empty-col"><span class="empty-col-icon">⚙️</span>ما في طلبات قيد التحضير</div>';

  document.getElementById('colDone').innerHTML = doneOrders.length
    ? [...doneOrders].reverse().map(o => buildOrderCard(o, 'done')).join('')
    : '<div class="empty-col"><span class="empty-col-icon">✅</span>ما في طلبات مكتملة بعد</div>';

  document.getElementById('colCancelled').innerHTML = cancelledOrders.length
    ? [...cancelledOrders].reverse().map(o => buildOrderCard(o, 'cancelled')).join('')
    : '<div class="empty-col"><span class="empty-col-icon">🗂️</span>ما في طلبات ملغية</div>';
}

function playNewOrderSound() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const playBeep = (freq, startTime, duration) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.frequency.value = freq;
      osc.type = 'sine';
      gain.gain.setValueAtTime(0.3, startTime);
      gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
      osc.start(startTime);
      osc.stop(startTime + duration);
    };
    const now = ctx.currentTime;
    playBeep(880, now, 0.15);
    playBeep(1046, now + 0.18, 0.2);
  } catch (e) {
    console.warn('تعذر تشغيل صوت التنبيه:', e);
  }
}

// الاستماع اللحظي لأي تغيير بالطلبات (يشتغل مع كل الأجهزة بنفس الوقت)
db.ref('orders').on('value', snap => {
  ordersCache = snap.val() || {};

  const newCount = Object.values(ordersCache).filter(o => o.status === 'new' && !o.archivedFromCashier).length;
  if (!isFirstLoad && newCount > previousNewCount) {
    showNotif('🔔 طلب جديد وصل!', '#3b82f6');
    playNewOrderSound();
  }
  previousNewCount = newCount;
  isFirstLoad = false;

  renderBoard();
});

// تحديث عداد "منذ متى" كل 30 ثانية بدون الحاجة لإعادة القراءة من Firebase
setInterval(renderBoard, 30000);
</script>
